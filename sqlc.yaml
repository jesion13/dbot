version: "2"
sql:
  - schema: "./db/migrations/"
    queries: "./db/queries/*.sql"
    engine: "sqlite"
    gen:
      go:
        package: "store"
        out: "pkg/store"
        overrides:
          - db_type: "Aliases"
            go_type: 
              import: "dbot/pkg/db/types"
              type: "Aliases"
  - schema: "./db/backup/"
    queries: "./db/backup-queries/backup-queries.sql"
    engine: "sqlite"
    gen:
      go:
        package: "backup"
        out: "pkg/backup"
